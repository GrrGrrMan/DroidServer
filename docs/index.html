<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Oppo A91 Infrastructure Docs</title>
  <meta http-equiv="X-UA-Compatible" content="IE=edge,chrome=1" />
  <meta name="description" content="Oppo A91 Headless Server Runbooks & Platform Invariants">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, minimum-scale=1.0">

  <!-- Docsify Themeable: Simple Dark (VS Code Aesthetic) -->
  <link rel="stylesheet" href="//cdn.jsdelivr.net/npm/docsify-themeable@0/dist/css/theme-simple-dark.css">

  <style>
    :root {
      /* Tuned to match VS Code Dark+ */
      --base-background-color: #1e1e1e;
      --sidebar-background: #181818;
      --sidebar-border-color: #282828;
      --sidebar-name-color: #ffffff;
      --sidebar-nav-link-color: #cccccc;
      --sidebar-nav-link-color--active: #007acc;
      --theme-color: #007acc;
      
      /* Smooth, polished table styling */
      --table-border-color: #333333;
      --table-cell-border-color: #333333;
      --table-head-background: #252526;
      --table-row-odd-background: #1f1f1f;
      --table-row-even-background: #1a1a1a;
      
      /* Blockquotes & Code */
      --blockquote-border-color: #007acc;
      --blockquote-background: #252526;
      --code-inline-background: #2d2d2d;
      --code-inline-color: #ce9178;
      --code-theme-background: #252526;
    }

    /* Clean rounded corners */
    .markdown-section pre {
      border: 1px solid #333333;
      border-radius: 6px !important;
    }
    table {
      border-radius: 4px;
      overflow: hidden;
    }
  </style>
</head>
<body>
  <div id="app">Loading documentation...</div>
  <script>
    window.$docsify = {
      name: 'Oppo A91 Server',
      repo: '',
      loadSidebar: true,
      subMaxLevel: 3,
      auto2top: true,
      homepage: 'README.md',
      copyCode: {
        buttonText: 'Copy',
        errorText: 'Error',
        successText: 'Copied'
      },
      search: {
        maxAge: 86400000,
        paths: 'auto',
        placeholder: 'Search docs...',
        noData: 'No results found',
        depth: 3
      }
    };
  </script>

  <!-- Docsify Core -->
  <script src="//cdn.jsdelivr.net/npm/docsify@4"></script>
  <!-- Docsify Themeable Engine -->
  <script src="//cdn.jsdelivr.net/npm/docsify-themeable@0"></script>
  
  <!-- Search & Copy Code Plugins -->
  <script src="//cdn.jsdelivr.net/npm/docsify/lib/plugins/search.min.js"></script>
  <script src="//cdn.jsdelivr.net/npm/docsify-copy-code/dist/docsify-copy-code.min.js"></script>

  <!-- Prism Syntax Highlighting -->
  <script src="//cdn.jsdelivr.net/npm/prismjs@1/components/prism-bash.min.js"></script>
  <script src="//cdn.jsdelivr.net/npm/prismjs@1/components/prism-powershell.min.js"></script>
  <script src="//cdn.jsdelivr.net/npm/prismjs@1/components/prism-python.min.js"></script>
  <script src="//cdn.jsdelivr.net/npm/prismjs@1/components/prism-json.min.js"></script>
  <script src="//cdn.jsdelivr.net/npm/prismjs@1/components/prism-markdown.min.js"></script>
</body>
</html>
